<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · MAKERS</title>
  <meta name="description" content="Accede a tu cuenta de MAKERS.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="site-header" data-component="header"></header>

  <main id="main">

    <div class="auth" style="--auth-img:url('img/mujer-cafe.jpg')">
      <aside class="auth__aside"><h2>Qué bueno <strong>verte de nuevo.</strong></h2></aside>
      <section class="auth__main" aria-labelledby="log-t">
        <div>
          <h1 class="auth__title" id="log-t">Iniciar sesión</h1>
          <p class="lead">Accede para contratar, publicar y gestionar tus pedidos.</p>
          <form class="form" id="login-form">
            <label class="field"><span>Correo electrónico</span><input type="email" name="email" required autocomplete="email"></label>
            <label class="field"><span>Contraseña</span><input type="password" name="password" required autocomplete="current-password"></label>
            <p class="form__error" id="form-error" role="alert"></p>
            <button class="btn btn--primary btn--block" type="submit">Entrar</button>
          </form>
          <p class="auth__alt">¿Aún no tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" data-component="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
